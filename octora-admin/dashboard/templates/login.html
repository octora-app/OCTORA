<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCTORA Admin — Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="loginbody">
<form class="logincard" method="post" action="/login">
  <div class="lbrand">🐙 OCTORA <span>ADMIN</span></div>
  <p class="muted">Seller control panel — private.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="Admin password" autofocus required>
  <button type="submit">Login →</button>
</form>
</body>
</html>
