services:
  - type: web
    name: octora-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OCTORA_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OCTORA_SELLER_PEM
        sync: false
